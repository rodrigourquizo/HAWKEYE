<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAWKEYE - Video Surveillance</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6; /* Violet */
            --secondary: #a78bfa;
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --text-light: #f8fafc;
            --accent: #d946ef; /* Magenta for alerts */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            margin-top: 120px;
            width: 90%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: #000;
        }

        .video-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            pointer-events: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .status-panel {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 900px;
            justify-content: space-around;
        }

        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 15px;
            flex: 1;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .card h3 {
            margin-top: 0;
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .card p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            margin-right: 5px;
        }

        .zone-indicator {
            background-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            font-size: 0.8rem;
            opacity: 0.6;
        }

    </style>
</head>
<body>

    <header>
        <h1>HAWKEYE</h1>
    </header>

    <div class="container">
        <div class="video-wrapper">
            <!-- Flask Video Stream -->
            <img src="{{ url_for('video_feed') }}" alt="Live Video Feed">
        </div>

        <div class="status-panel">
            <div class="card">
                <h3>System Status</h3>
                <p><span class="indicator"></span> Active Monitoring</p>
            </div>
            <div class="card">
                <h3>Detection Zone</h3>
                <p><span class="indicator zone-indicator"></span> Huaca Purple Zone</p>
            </div>
            <div class="card">
                <h3>Notifications</h3>
                <p>Telegram Integration: <span style="color:#22c55e">ON</span></p>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2024 HAWKEYE Project. People Detection & Drone Surveillance.
    </footer>

</body>
</html>
